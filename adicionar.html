<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar doação</title>
    <link rel="stylesheet" href="assets/css/adicionar-doacao/adicionar-doacao.css">
</head>

<body>
    <div id="container">
        <div id="header">
            <img src="/assets/img/logo.avif" alt="logo">

            <div id="header-buttons">

                <div class="nav-item" onclick="window.location.href='./homepage.html'">
                    <img src="assets/img/homepage/heart.svg" alt="">
                    <button type="button" class="nav-btn ">Doações</button>
                </div>
                <div class="nav-item" onclick="window.location.href='./historico.html'">
                    <img src="assets/img/homepage/history.svg" alt="">
                    <button type="button" class="nav-btn">Histórico</button>
                </div>
                <div class="nav-item" onclick="window.location.href='./adicionar.html'">
                    <img src="assets/img/homepage/add.svg" alt="">
                    <button type="button" class="nav-btn">Adicionar</button>
                </div>
                <div class="nav-item" onclick="window.location.href='./chat.html'">
                    <img src="assets/img/homepage/chat.svg" alt="">
                    <button type="button" class="nav-btn">Chat</button>
                </div>
                <div class="nav-item" onclick="window.location.href='./perfil.html'">
                    <img src="assets/img/homepage/user.svg" alt="">
                    <button type="button" class="nav-btn">Perfil</button>
                </div>
                <div class="nav-item">
                    <button type="button" class="logout-btn">Logout</button>
                </div>
            </div>

    </div>

    <main class="add-donation">
        <div class="form-card">
            <h2>Criar Doação</h2>

            <form id="donation-form" enctype="multipart/form-data">
                <!-- Hidden user id (adjust dynamically in future) -->
                <input type="hidden" name="usuarioId" value="1" />

                <div id="form-fields">
                    <div class="field">
                        <label class="label" for="titulo">Título</label>
                        <input name="titulo" type="text" id="titulo" required placeholder="Título do item"/>
                    </div>

                    <div class="field">
                        <label class="label" for="categoria">Categoria</label>
                        <select name="categoria" id="categoria" required>
                            <option value="RACAO">Ração</option>
                            <option value="MEDICAMENTOS">Medicamentos</option>
                            <option value="ACESSORIOS">Acessórios</option>
                            <option value="OUTROS" selected>Outros</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label" for="estadoConservacao">Estado de conservação</label>
                        <select name="estadoConservacao" id="estadoConservacao" required>
                            <option value="NOVO" selected>Novo</option>
                            <option value="USADO">Usado</option>
                            <option value="BOAS_CONDICOES">Em boas condições</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label" for="estado">Estado</label>
                        <select name="estado" id="estado" required>
                            <option value="SP" selected>SP</option>
                            <option value="RJ">RJ</option>
                            <option value="MG">MG</option>
                            <option value="BA">BA</option>
                            <option value="PR">PR</option>
                            <option value="SC">SC</option>
                            <option value="RS">RS</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label" for="cidade">Cidade</label>
                        <input name="cidade" type="text" id="cidade" required value="São Paulo" />
                    </div>

                    <div class="field">
                        <label class="label" for="bairro">Bairro</label>
                        <input name="bairro" type="text" id="bairro" required placeholder="Bairro" />
                    </div>

                    <div class="field">
                        <label class="label" for="cep">CEP</label>
                        <input name="cep" type="text" id="cep" required placeholder="00000-000" />
                    </div>

                    <div class="field">
                        <label class="label" for="descricao">Descrição</label>
                        <textarea name="descricao" id="descricao" required placeholder="Descrição do item"></textarea>
                    </div>

                    <div class="field full-width">
                        <label class="label" for="imagens">Imagens</label>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input name="imagens" type="file" multiple style="display: none;" />
                            <button type="button" id="add-images-btn">Adicionar Imagens</button>
                        </div>
                        <small style="color: #666; margin-top: 5px; display: block;">Clique em "Adicionar Imagens" para selecionar múltiplas fotos</small>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="create-btn">Criar doação</button>
                </div>

                <div id="form-message" role="status" aria-live="polite"></div>

        <div class="image-preview" id="image-preview" aria-hidden="true"></div>
    </main>

    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/custom-select.js"></script>
    <script defer src="assets/js/adicionar.js"></script>

</body>

</html>
